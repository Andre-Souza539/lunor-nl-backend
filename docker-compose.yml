version: '3.8'

services:
  db-lunor:
    image: postgres:16-alpine
    container_name: lunor_db
    restart: always
    environment:
      POSTGRES_DB: lunordb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_lunor_data:/var/lib/postgresql/data

volumes:
  postgres_lunor_data: