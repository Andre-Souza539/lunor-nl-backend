spring:
  application:
    name: lunor

  banner:
    location: classpath:banner.txt
  main:
    banner-mode: console

  output:
    ansi:
      enabled: ALWAYS
  
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 5
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect